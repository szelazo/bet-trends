<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#0a0e13" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#eef1f4" media="(prefers-color-scheme: light)" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9A%BD%3C/text%3E%3C/svg%3E" />
  <title>Bet Trends</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="ambient" aria-hidden="true"></div>

  <header class="topbar">
    <div class="bar">
      <div class="brand">
        <span class="logo">⚽</span>
        <span class="wordmark">Bet Trends</span>
      </div>
      <span id="meta" class="meta"></span>
    </div>
    <h1 id="dayHeading" class="day-heading">—</h1>
    <div id="dateStrip" class="date-strip" role="tablist" aria-label="Escolher data"></div>
  </header>

  <div class="filters">
    <div class="segmented" id="minConf" role="group" aria-label="Confiança mínima">
      <button data-v="0" class="on">Todas</button>
      <button data-v="50">50+</button>
      <button data-v="60">60+</button>
      <button data-v="70">70+</button>
    </div>
    <div class="selects">
      <label class="sel">
        <select id="leagueFilter" aria-label="Filtrar por liga"><option value="">Todas as ligas</option></select>
      </label>
      <label class="sel">
        <select id="marketFilter" aria-label="Filtrar por mercado">
          <option value="">Todos os mercados</option>
          <option value="1x2">Resultado (1X2)</option>
          <option value="double_chance">Dupla chance</option>
          <option value="over_under">Over / Under</option>
          <option value="btts">Ambos marcam</option>
        </select>
      </label>
    </div>
  </div>

  <main id="list" class="list"></main>
  <p id="empty" class="empty" hidden>Nenhum jogo bate com os filtros deste dia.</p>

  <footer class="foot">
    <p class="disclaimer">
      Sugestões de um modelo estatístico (Poisson + tendências recentes) — sem garantia de acerto.
      Não é recomendação financeira. Aposte com responsabilidade e só o que puder perder.
    </p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
