name: Gerar sugestões diárias

on:
  schedule:
    - cron: "0 11 * * *"   # 11:00 UTC ≈ 08:00 BRT
    - cron: "0 20 * * *"   # 20:00 UTC ≈ 17:00 BRT (2ª passada p/ pegar odds mais firmes)
  workflow_dispatch:        # botão "Run workflow" na aba Actions

permissions:
  contents: write

concurrency:
  group: daily-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}   # opcional; funciona sem
        run: python -m app.build --days 3 --cache-dir /tmp/betcache

      - name: Sanidade — a build tem que produzir jogos
        run: |
          python - <<'PY'
          import json, glob, sys
          total = sum(json.load(open(f)).get("count", 0) for f in glob.glob("docs/data/20*.json"))
          print(f"total de jogos listados: {total}")
          if total == 0:
              sys.exit("FALHA: 0 jogos — a fonte de dados (365scores) pode ter mudado.")
          PY

      - name: Commit se houver mudança
        run: |
          git config user.name  "bet-trends-bot"
          git config user.email "actions@github.com"
          git add docs/data
          if git diff --staged --quiet; then
            echo "Nada mudou."
          else
            git commit -m "dados: $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
